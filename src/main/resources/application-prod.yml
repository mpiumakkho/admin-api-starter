# Production: only what differs from application.yml. Every secret comes from the environment.
spring:
  datasource:
    # With sslmode=verify-full, or the server does not start (DatabaseTlsConfig, P-041)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      # TLS or no mail: never the links in invitations and resets in the clear, and the server's certificate checked
      # (P-041)
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true

server:
  # Behind a reverse proxy: take the client's address and scheme from X-Forwarded-*
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Whose X-Forwarded-For to believe, as a regular expression of addresses: the reverse proxy's, nobody else's.
      # Tomcat's own default believes every private address, so anyone inside the network could pass for another
      # address and get round the rate limits and the lockout (P-040)
      internal-proxies: ${AC_TRUSTED_PROXIES}

access-control:
  token:
    keys:
      - kid: ${AC_JWT_KID}
        private-key: ${AC_JWT_PRIVATE_KEY}
        public-key: ${AC_JWT_PUBLIC_KEY}
  cookie:
    name: __Secure-ac_rt
    secure: true
  cors:
    allowed-origins: ${AC_ALLOWED_ORIGINS}
  mail:
    from: ${AC_MAIL_FROM}
    base-url: ${AC_DASHBOARD_URL}
  encryption:
    password: ${AC_ENCRYPTION_PASSWORD}
    salt: ${AC_ENCRYPTION_SALT}

logging:
  structured:
    format:
      console: ecs
