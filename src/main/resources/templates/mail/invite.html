<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="|You're invited to ${productName}|">You're invited</title>
</head>
<body style="font-family: system-ui, sans-serif; color: #1f2937; line-height: 1.5;">
<p th:text="|Hi ${firstName},|">Hi,</p>
<p th:text="|You've been invited to ${productName}. Set a password to start using your account.|">
    You've been invited. Set a password to start using your account.
</p>
<p>
    <a th:href="${link}" style="display: inline-block; padding: 10px 16px; background: #4f46e5; color: #ffffff;
       border-radius: 6px; text-decoration: none;">Set your password</a>
</p>
<p style="color: #6b7280; font-size: 14px;" th:text="|The link works once, until ${expiresAt}.|">
    The link works once.
</p>
<p style="color: #6b7280; font-size: 14px;">If you weren't expecting this, you can ignore this email.</p>
</body>
</html>
