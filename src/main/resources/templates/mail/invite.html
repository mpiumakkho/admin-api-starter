<!DOCTYPE html>
<!--/* The invitation: what it says. The theme in access-control.mail.theme lays it out (P-044) */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/themes/__${theme}__ :: email(tone='welcome',
        lines=#{mail.invite.intro(${productName})},
        action=#{mail.invite.button}, link=${link},
        note=#{mail.link.expires(${productName}, ${expiresAt})},
        footer=#{mail.invite.ignore})}">
</html>
