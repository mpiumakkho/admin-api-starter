<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">You're invited</title>
</head>
<body style="font-family: system-ui, sans-serif; color: #1f2937; line-height: 1.5;">
<p th:text="#{mail.greeting(${productName}, ${firstName})}">Hi,</p>
<p th:text="#{mail.invite.intro(${productName})}">You've been invited. Set a password to start using your account.</p>
<p>
    <a th:href="${link}" style="display: inline-block; padding: 10px 16px; background: #4f46e5; color: #ffffff;
       border-radius: 6px; text-decoration: none;" th:text="#{mail.invite.button}">Set your password</a>
</p>
<p style="color: #6b7280; font-size: 14px;" th:text="#{mail.link.expires(${productName}, ${expiresAt})}">The link works once.</p>
<p style="color: #6b7280; font-size: 14px;" th:text="#{mail.invite.ignore}">If you weren't expecting this, you can ignore this email.</p>
</body>
</html>
