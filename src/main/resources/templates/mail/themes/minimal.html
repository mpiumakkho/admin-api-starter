<!DOCTYPE html>
<!--/* minimal (P-044): black on white and nothing else. The product's name over a heavy rule, a large heading, a square
       button with an arrow, the note set in monospace; the tone is a single small square of colour by the label.
       Parameters: see indigo.html. */-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="email(tone, lines, action, link, note, footer)" lang="en"
      th:lang="${#locale.language}"
      th:with="accent=${tone == 'security' ? '#e11d48' : tone == 'warning' ? '#f59e0b' : tone == 'action' ? '#10b981' : tone == 'key' ? '#8b5cf6' : tone == 'info' ? '#0ea5e9' : '#4f46e5'},
               font='Helvetica Neue, Helvetica, Arial, Noto Sans Thai, Leelawadee UI, sans-serif',
               mono='ui-monospace, SFMono-Regular, Menlo, Consolas, Noto Sans Thai, Leelawadee UI, monospace'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title th:text="${subject}">Subject</title>
    <style>
        @media (max-width: 620px) {
            .shell { padding: 32px 20px !important; }
            .heading { font-size: 29px !important; line-height: 38px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background: #ffffff; -webkit-text-size-adjust: 100%;">
<div style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; color: #ffffff; opacity: 0;"
     ><th:block th:each="line, at : ${lines}" th:if="${at.first}" th:text="${line}">Preview</th:block>&#8203;&#8199;&#847;&#8203;&#8199;&#847;&#8203;&#8199;&#847;&#8203;&#8199;&#847;&#8203;&#8199;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="background: #ffffff;">
    <tr>
        <td align="center" class="shell" style="padding: 56px 24px;">
            <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px;">
                <tr>
                    <td style="padding-bottom: 14px; border-bottom: 3px solid #000000; color: #000000; font-size: 15px; font-weight: 700; line-height: 20px;"
                        th:styleappend="|font-family: ${font};|" th:text="${productName}">Admin</td>
                </tr>
                <tr>
                    <td style="padding-top: 44px; color: #1f1f1f; font-size: 16px; line-height: 27px;" th:styleappend="|font-family: ${font};|">
                        <p style="margin: 0; color: #000000; font-size: 13px; font-weight: 700; line-height: 18px;">
                            <span style="display: inline-block; width: 10px; height: 10px; margin-right: 9px; vertical-align: 0;"
                                  th:styleappend="|background: ${accent};|"></span><span th:text="${#messages.msg('mail.tone.' + tone)}">Invitation</span>
                        </p>
                        <h1 class="heading" style="margin: 18px 0 0; color: #000000; font-size: 36px; font-weight: 800; line-height: 46px;"
                            th:styleappend="|font-family: ${font};|" th:text="${subject}">Subject</h1>
                        <p style="margin: 30px 0 0;" th:text="#{mail.greeting(${productName}, ${firstName})}">Hi,</p>
                        <p style="margin: 12px 0 0;" th:each="line : ${lines}" th:text="${line}">What happened.</p>
                        <table th:if="${action != null}" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top: 34px;">
                            <tr>
                                <td bgcolor="#000000" style="background: #000000;">
                                    <a th:href="${link}" target="_blank"
                                       style="display: inline-block; padding: 16px 26px; background: #000000; color: #ffffff; font-size: 15px; font-weight: 700; line-height: 20px; text-decoration: none;"
                                       th:styleappend="|font-family: ${font};|"><span th:text="${action}">Open</span>&nbsp;&nbsp;&nbsp;&rarr;</a>
                                </td>
                            </tr>
                        </table>
                        <p th:if="${note != null}" style="margin: 26px 0 0; color: #3d3d3d; font-size: 13px; line-height: 22px;"
                           th:styleappend="|font-family: ${mono};|">&mdash;&nbsp;<span th:text="${note}">The link works once.</span></p>
                        <p th:if="${link != null}" style="margin: 26px 0 0; color: #555555; font-size: 13px; line-height: 21px;">
                            <span th:text="#{mail.link.fallback}">If the button doesn't work:</span><br>
                            <a th:href="${link}" target="_blank" style="color: #000000; font-size: 12px; text-decoration: underline; word-break: break-all;"
                               th:styleappend="|font-family: ${mono};|" th:text="${link}">https://</a>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding-top: 44px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr><td style="border-top: 1px solid #000000; font-size: 0; line-height: 0;">&nbsp;</td></tr>
                        </table>
                        <p style="margin: 18px 0 0; color: #3d3d3d; font-size: 13px; line-height: 21px;"
                           th:styleappend="|font-family: ${font};|" th:text="${footer}">Why you get this email.</p>
                        <p style="margin: 10px 0 0; color: #5c5c5c; font-size: 12px; line-height: 19px;"
                           th:styleappend="|font-family: ${font};|" th:text="#{mail.automated(${productName})}">Sent automatically.</p>
                    </td>
                </tr>
            </table>
            <!--[if mso]></td></tr></table><![endif]-->
        </td>
    </tr>
</table>
</body>
</html>
