<!DOCTYPE html>
<!--/* The password reset link: what it says. The theme in access-control.mail.theme lays it out (P-044) */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/themes/__${theme}__ :: email(tone='key',
        lines=#{mail.reset.intro(${productName})},
        action=#{mail.reset.button}, link=${link},
        note=#{mail.link.expires(${productName}, ${expiresAt})},
        footer=#{mail.reset.ignore})}">
</html>
