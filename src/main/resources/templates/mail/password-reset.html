<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="|Set a new password for ${productName}|">Set a new password</title>
</head>
<body style="font-family: system-ui, sans-serif; color: #1f2937; line-height: 1.5;">
<p th:text="|Hi ${firstName},|">Hi,</p>
<p th:text="|Someone asked to set a new password for your ${productName} account.|">
    Someone asked to set a new password for your account.
</p>
<p>
    <a th:href="${link}" style="display: inline-block; padding: 10px 16px; background: #4f46e5; color: #ffffff;
       border-radius: 6px; text-decoration: none;">Set a new password</a>
</p>
<p style="color: #6b7280; font-size: 14px;" th:text="|The link works once, until ${expiresAt}.|">
    The link works once.
</p>
<p style="color: #6b7280; font-size: 14px;">
    If it wasn't you, ignore this email: your password stays as it is, unless an administrator reset it.
</p>
</body>
</html>
