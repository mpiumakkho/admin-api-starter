<!DOCTYPE html>
<!--/* A notice about someone's account: MailNotificationService.sendNotice gives the tone, the paragraphs, the footer
       and, for a kind with a .button, the button. The theme in access-control.mail.theme lays it out (P-044) */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/themes/__${theme}__ :: email(tone=${tone},
        lines=${lines}, action=${action}, link=${link}, note=${null}, footer=${footer})}">
</html>
