# The emails the server sends (P-029), in English; mail_th.properties has the same keys in Thai, and MailMessagesTest
# keeps them in step. Every message goes through MessageFormat: {0} is the product's name and the values follow from
# {1}; an apostrophe is written ''. A body has one paragraph per line (\n).

mail.greeting=Hi {1},
mail.link.expires=The link works once, until {1}.

mail.invite.subject=You''re invited to {0}
mail.invite.intro=You''ve been invited to {0}. Set a password to start using your account.
mail.invite.button=Set your password
mail.invite.ignore=If you weren''t expecting this, you can ignore this email.

mail.reset.subject=Set a new password for {0}
mail.reset.intro=Someone asked to set a new password for your {0} account.
mail.reset.button=Set a new password
mail.reset.ignore=If it wasn''t you, ignore this email: your password stays as it is, unless an administrator reset it.

# Under the notices about someone's account, unless a kind has a footer of its own
mail.notice.footer=If you did not expect this, tell your administrator, and change your password.

# {1} browser, {2} system, {3} IP address, {4} when
mail.new-device.subject=New sign-in to {0}
mail.new-device.body=Your {0} account was just signed in from a device it was not used on before.\nDevice: {1} on {2}, from {3}, {4}.

# {1} the role, {2} where it applies, {3} from when (or nothing, from now), {4} until when
mail.role-given.subject=You have a new role in {0}
mail.role-given.body=You were given the role {1} {2}{3}{4}.
mail.role-given.scope.organization=for the whole organization
mail.role-given.scope.branch=in {1} only
mail.role-given.from=, from {1}
mail.role-given.until=, until {1}
mail.role-given.for-good=, for good

# {1} the old email, {2} the new one; sent to the old one
mail.email-changed.subject=Your {0} email was changed
mail.email-changed.body=The email of your {0} account was changed from {1} to {2}.

mail.password-changed.subject=Your {0} password was changed
mail.password-changed.body=The password of your {0} account was changed.

# {1} how many days nobody signed in
mail.inactive-suspended.subject=Your {0} account was suspended
mail.inactive-suspended.body=Your {0} account was suspended because nobody signed in to it for {1} days.\nAsk your administrator to restore it if you still need it.

# {1} the review, {2} how many roles to decide, {3} when it closes, {4} the link to it
mail.access-review.subject=Access review: {1}
mail.access-review.body=The access review {1} has {2} role assignments for you to decide, by {3}.\nFor each one, choose Keep or Remove. The roles marked Remove are taken away when the review closes; the ones nobody decided stay as they are.\nOpen the review: {4}
mail.access-review.footer=You get this email because you look after some of the people in this review, or it names you.
