# The emails the server sends (P-029), in Thai: the keys of mail.properties, which explains them.

mail.greeting=เรียน คุณ{1}
mail.link.expires=ลิงก์นี้ใช้ได้ครั้งเดียว ถึง {1}

mail.invite.subject=คุณได้รับเชิญให้ใช้ {0}
mail.invite.intro=คุณได้รับเชิญให้ใช้ {0} ตั้งรหัสผ่านเพื่อเริ่มใช้บัญชีของคุณ
mail.invite.button=ตั้งรหัสผ่าน
mail.invite.ignore=หากคุณไม่ได้คาดว่าจะได้รับอีเมลนี้ ไม่ต้องทำอะไร

mail.reset.subject=ตั้งรหัสผ่านใหม่สำหรับ {0}
mail.reset.intro=มีคำขอตั้งรหัสผ่านใหม่สำหรับบัญชี {0} ของคุณ
mail.reset.button=ตั้งรหัสผ่านใหม่
mail.reset.ignore=หากคุณไม่ได้ขอ ไม่ต้องทำอะไร รหัสผ่านเดิมยังใช้ได้ เว้นแต่ผู้ดูแลระบบรีเซ็ตให้

mail.notice.footer=หากคุณไม่ได้ทำรายการนี้ โปรดแจ้งผู้ดูแลระบบและเปลี่ยนรหัสผ่าน

mail.new-device.subject=มีการเข้าสู่ระบบ {0} จากอุปกรณ์ใหม่
mail.new-device.body=บัญชี {0} ของคุณเพิ่งเข้าสู่ระบบจากอุปกรณ์ที่ไม่เคยใช้มาก่อน\nอุปกรณ์: {1} บน {2} จาก {3} เมื่อ {4}

mail.role-given.subject=คุณได้รับบทบาทใหม่ใน {0}
mail.role-given.body=คุณได้รับบทบาท {1} {2}{3}{4}
mail.role-given.scope.organization=ทั้งองค์กร
mail.role-given.scope.branch=เฉพาะสาขา {1}
mail.role-given.from=\ ตั้งแต่ {1}
mail.role-given.until=\ จนถึง {1}
mail.role-given.for-good=\ แบบถาวร

mail.email-changed.subject=อีเมลของบัญชี {0} ถูกเปลี่ยน
mail.email-changed.body=อีเมลของบัญชี {0} ของคุณถูกเปลี่ยนจาก {1} เป็น {2}

mail.password-changed.subject=รหัสผ่านของบัญชี {0} ถูกเปลี่ยน
mail.password-changed.body=รหัสผ่านของบัญชี {0} ของคุณถูกเปลี่ยนแล้ว

mail.inactive-suspended.subject=บัญชี {0} ของคุณถูกระงับ
mail.inactive-suspended.body=บัญชี {0} ของคุณถูกระงับ เพราะไม่มีการเข้าใช้นาน {1} วัน\nหากยังต้องใช้บัญชีนี้ โปรดติดต่อผู้ดูแลระบบเพื่อเปิดใช้อีกครั้ง

mail.access-review.subject=ทบทวนสิทธิ์: {1}
mail.access-review.body=รอบทบทวนสิทธิ์ {1} มีการมอบบทบาท {2} รายการให้คุณตัดสิน ภายใน {3}\nเลือก "คงไว้" หรือ "ถอด" ทีละรายการ บทบาทที่ตัดสินว่าถอดจะถูกถอดเมื่อปิดรอบ ส่วนรายการที่ไม่มีใครตัดสินจะคงไว้ตามเดิม\nเปิดรอบทบทวน: {4}
mail.access-review.footer=คุณได้รับอีเมลนี้เพราะคุณดูแลบางคนในรอบนี้ หรือรอบนี้ระบุชื่อคุณเป็นผู้ทบทวน
