# Development services: docker compose -f docker/docker-compose.yml up -d
name: admin-api-starter

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: admin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    # 5433 on the host, so it does not clash with a PostgreSQL already installed on 5432
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      interval: 5s
      retries: 10

  # Catches every email the API sends: read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres:
